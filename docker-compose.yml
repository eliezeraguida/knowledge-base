services:
  postgres:
    image: postgres:16
    container_name: knowledge-base-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:30.2
    container_name: knowledge-base-typesense
    restart: unless-stopped

    ports:
      - "8108:8108"

    volumes:
      - typesense_data:/data

    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}

    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}

volumes:
  postgres_data:
  typesense_data: